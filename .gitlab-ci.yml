stages:
  - test
  - build

# Paths that can actually change behaviour. Docs (*.md), screenshots and the
# production/ manifests are excluded on purpose — rebuilding a multi-arch image
# because a README line moved is pure waste. GitLab's `changes:` has no negation,
# so this is an allowlist rather than a "skip docs" rule.
.code_changes: &code_changes
  - "**/*.py"
  - "**/*.html"
  - "locales/**/*"
  - "tests/**/*"
  - requirements.txt
  - requirements-dev.txt
  - pytest.ini
  - Dockerfile
  - .dockerignore
  - .gitlab-ci.yml

test:
  stage: test
  tags:
    - arm64
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir -r requirements-dev.txt
  script:
    - python -m pytest
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
      changes: *code_changes

.build_base: &build_base
  stage: build
  tags:
    - arm64
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: registry.racis.dev/marceliracis/minio-dash
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --name builder || true
    - docker buildx inspect --bootstrap

build_latest:
  <<: *build_base
  script:
    - docker buildx build
        --platform linux/amd64,linux/arm64
        --tag $IMAGE:latest
        --push .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *code_changes

build_tag:
  <<: *build_base
  script:
    - docker buildx build
        --platform linux/amd64,linux/arm64
        --tag $IMAGE:$CI_COMMIT_TAG
        --tag $IMAGE:latest
        --push .
  only:
    - tags
