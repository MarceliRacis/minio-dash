stages:
  - build

build:
  stage: build
  image: docker:26
  tags:
    - arm64
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: registry.racis.dev/marceliracis/minio-dash
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --name builder || true
    - docker buildx inspect --bootstrap
  script:
    - docker buildx build
        --platform linux/amd64,linux/arm64
        --tag $IMAGE:v1
        --tag $IMAGE:latest
        --push
        .
  only:
    - main
