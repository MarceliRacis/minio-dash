services:
  minio-dash:
    image: registry.racis.dev/marceliracis/minio-dash:latest
    restart: unless-stopped
    ports:
      - "${PORT:-7474}:${PORT:-7474}"
    env_file:
      - .env
    environment:
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - SECRET_KEY=${SECRET_KEY}
      - PORT=${PORT:-7474}
      - WEBUI_HOST=${WEBUI_HOST:-http://localhost:7474}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-7474}/')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
