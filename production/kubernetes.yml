apiVersion: v1
kind: Service
metadata:
  name: minio-dash
spec:
  selector:
    app: minio-dash
  ports:
    - protocol: TCP
      port: 80
      targetPort: 7474
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-dash
spec:
  replicas: 3
  selector:
    matchLabels:
      app: minio-dash
  template:
    metadata:
      labels:
        app: minio-dash
    spec:
      containers:
      - name: minio-dash
        image: registry.racis.dev/marceliracis/minio-dash:latest
        ports:
        - containerPort: 7474
        env:
        - name: MINIO_ENDPOINT
          value: "http://minio-service:9000"
        - name: SESSION_BACKEND
          value: "jwt"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: dash-secrets
              key: secret-key
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: dash-secrets
              key: encryption-key
---
apiVersion: v1
kind: Secret
metadata:
  name: dash-secrets
type: Opaque
data:
  # echo -n "secret" | base64
  secret-key: Y2hvb3NlLWEtbG9uZy1zZWNyZXQta2V5
  encryption-key: Y2hvb3NlLWEtMzItY2hhci1lbmNyeXB0aW9uLWtleS0xMjM=
